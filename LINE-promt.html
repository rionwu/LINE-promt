<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 貼圖 Prompt 生成器</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* Grid Selection */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .style-item {
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }

        .style-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .style-item.active {
            border-color: var(--primary-color);
            background-color: #e8f5e9;
        }

        .style-item img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .style-item span {
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            word-break: break-all;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        /* Color Inputs */
        .color-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-item input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Textarea */
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            background: var(--primary-hover);
        }

        .result-box {
            background: #1e293b;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .copy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            float: right;
            font-weight: 600;
        }

        .copy-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

<header>
    <h1>🎨 AI 貼圖 Prompt 生成器</h1>
    <p style="color: var(--text-sub);">快速選擇風格與參數，一鍵生成 4x4 貼圖提示詞</p>
</header>

<!-- Step 1: Art Style -->
<div class="card">
    <div class="section-title">1. 選擇畫風 (Art Style)</div>
    <div class="style-grid" id="artStyleContainer"></div>
</div>

<!-- Step 2: Sub Style -->
<div class="card">
    <div class="section-title">2. 選擇細部風格 (Sub Style)</div>
    <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="filterSubStyles('ALL', this)">全部</button>
        <button class="tab-btn" onclick="filterSubStyles('可愛療癒系', this)">可愛療癒系</button>
        <button class="tab-btn" onclick="filterSubStyles('女生類別', this)">女生類別</button>
        <button class="tab-btn" onclick="filterSubStyles('男生類別', this)">男生類別</button>
    </div>
    <div class="style-grid" id="subStyleContainer"></div>
</div>

<!-- Step 3: Colors -->
<div class="card">
    <div class="section-title">3. 配色設定</div>
    <div class="color-group">
        <div class="color-item">
            <label>背景顏色：</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="color-item">
            <label>文字顏色：</label>
            <input type="color" id="textColor" value="#000000">
        </div>
    </div>
</div>

<!-- Step 4: Lines Text -->
<div class="card">
    <div class="section-title">4. 16 句日常台詞 (每行一句)</div>
    <textarea id="linesInput" rows="8">1. 早安
2. 辛苦了
3. 謝謝你
4. OK!
5. +1
6. 收到
7. 哈哈
8. 拜託了
9. 晚安
10. 對不起
11. 愛你喔
12. 傻眼
13. 加油
14. 讚啦
15. 忙碌中
16. OK啦</textarea>
    <button class="btn-generate" onclick="generatePrompt()">🚀 生成 Prompt 提示詞</button>
</div>

<!-- Output Result -->
<div class="card" id="resultCard" style="display:none;">
    <div class="section-title">
        <span>生成結果</span>
        <button class="copy-btn" onclick="copyResult()">複製內容</button>
    </div>
    <div class="result-box" id="resultOutput"></div>
</div>

<script>
    // 預設 GitHub 圖片資料庫 (已同步更新副檔名與名稱)
    const defaultData = {
        artStyles: [
            { name: "水墨風", img: "image-print01.jpg" },
            { name: "色鉛筆風", img: "image-print02.jpg" },
            { name: "油畫風", img: "image-print03.jpg" },
            { name: "剪紙風", img: "image-print04.jpg" },
            { name: "像素Pixel風", img: "image-print05.jpg" },
            { name: "黏土3D風", img: "image-print06.jpg" },
            { name: "羊毛氈風", img: "image-print07.jpg" },
            { name: "版畫風", img: "image-print08.jpg" },
            { name: "復古海報風", img: "image-print09.jpg" },
            { name: "玻璃彩繪風", img: "image-print10.jpg" },
            { name: "手繪速寫風", img: "image-print11.jpg" }
        ],
        subStyles: [
            { name: "可愛療癒 01", category: "可愛療癒系", img: "image-Q01.png" },
            { name: "可愛療癒 02", category: "可愛療癒系", img: "image-Q02.png" },
            { name: "可愛療癒 03", category: "可愛療癒系", img: "image-Q03.png" },
            { name: "可愛療癒 04", category: "可愛療癒系", img: "image-Q04.png" },
            { name: "可愛療癒 05", category: "可愛療癒系", img: "image-Q05.png" },
            { name: "可愛療癒 06", category: "可愛療癒系", img: "image-Q06.png" },
            { name: "可愛療癒 07", category: "可愛療癒系", img: "image-Q07.png" },
            { name: "可愛療癒 08", category: "可愛療癒系", img: "image-Q08.png" },
            { name: "可愛療癒 09", category: "可愛療癒系", img: "image-Q09.png" },
            { name: "可愛療癒 10", category: "可愛療癒系", img: "image-Q10.png" },
            { name: "女生風格 01", category: "女生類別", img: "image-girl01.jpg" },
            { name: "女生風格 02", category: "女生類別", img: "image-girl02.jpg" },
            { name: "女生風格 03", category: "女生類別", img: "image-girl03.jpg" },
            { name: "女生風格 04", category: "女生類別", img: "image-girl04.jpg" },
            { name: "女生風格 05", category: "女生類別", img: "image-girl05.jpg" },
            { name: "女生風格 06", category: "女生類別", img: "image-girl06.jpg" },
            { name: "女生風格 07", category: "女生類別", img: "image-girl07.jpg" },
            { name: "女生風格 08", category: "女生類別", img: "image-girl08.jpg" },
            { name: "女生風格 09", category: "女生類別", img: "image-girl09.jpg" },
            { name: "女生風格 10", category: "女生類別", img: "image-girl10.jpg" },
            { name: "男生風格 01", category: "男生類別", img: "image-boy01.jpg" },
            { name: "男生風格 02", category: "男生類別", img: "image-boy02.jpg" },
            { name: "男生風格 03", category: "男生類別", img: "image-boy03.jpg" },
            { name: "男生風格 04", category: "男生類別", img: "image-boy04.jpg" },
            { name: "男生風格 05", category: "男生類別", img: "image-boy05.jpg" },
            { name: "男生風格 06", category: "男生類別", img: "image-boy06.jpg" },
            { name: "男生風格 07", category: "男生類別", img: "image-boy07.jpg" },
            { name: "男生風格 08", category: "男生類別", img: "image-boy08.jpg" },
            { name: "男生風格 09", category: "男生類別", img: "image-boy09.jpg" },
            { name: "男生風格 10", category: "男生類別", img: "image-boy10.jpg" }
        ],
        template: `以這個角色為我的角色。請用 [我的角色] 生成一張適合製作貼圖的 4×4 貼圖畫板。

基本規格：
- 畫布尺寸：1480×1280 px。
- 排版方式：4×4，共 16 格。
- 每格尺寸固定為 370×320 px。
- 16 張貼圖需從左到右、從上到下排列。
- 每張貼圖都必須完整位於各自格子中，不可互相重疊，而且上下左右必須距離格子2px。

角色一致性：
- 每一格都是同一角色的不同表情、動作或日常情境。
- 角色必須保持同一造型、同一配色、同一畫風與同一線條風格。
- 不要讓角色在不同格子中變成不同角色。
- 角色畫風：{artStyle}
- 角色風格：{subStyle}

背景與畫面限制：
- 背景顏色使用色碼{bgColor}
- 文字顏色使用色碼{textColor}
- 不要發光效果。
- 不要陰影光暈。

16 句日常台詞內容：
{linesText}`
    };

    function getData() {
        const stored = localStorage.getItem('sticker_generator_config');
        if (stored) {
            try { return JSON.parse(stored); } catch(e) { return defaultData; }
        }
        return defaultData;
    }

    const config = getData();
    let selectedArtStyle = config.artStyles[0]?.name || '';
    let selectedSubStyle = config.subStyles[0]?.name || '';

    function init() {
        renderArtStyles();
        renderSubStyles('ALL');
    }

    function renderArtStyles() {
        const container = document.getElementById('artStyleContainer');
        container.innerHTML = '';
        config.artStyles.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `style-item ${item.name === selectedArtStyle ? 'active' : ''}`;
            div.onclick = () => {
                selectedArtStyle = item.name;
                renderArtStyles();
            };
            
            const img = item.img ? `<img src="${item.img}">` : '';
            div.innerHTML = `${img}<span>${item.name}</span>`;
            container.appendChild(div);
        });
    }

    function filterSubStyles(cat, btnElem) {
        if (btnElem) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');
        }
        renderSubStyles(cat);
    }

    function renderSubStyles(category) {
        const container = document.getElementById('subStyleContainer');
        container.innerHTML = '';
        const filtered = category === 'ALL' 
            ? config.subStyles 
            : config.subStyles.filter(s => s.category === category);

        filtered.forEach((item) => {
            const div = document.createElement('div');
            div.className = `style-item ${item.name === selectedSubStyle ? 'active' : ''}`;
            div.onclick = () => {
                selectedSubStyle = item.name;
                renderSubStyles(category);
            };
            
            const img = item.img ? `<img src="${item.img}">` : '';
            div.innerHTML = `${img}<span>${item.name}</span>`;
            container.appendChild(div);
        });
    }

    function generatePrompt() {
        const bgColor = document.getElementById('bgColor').value;
        const textColor = document.getElementById('textColor').value;
        const linesText = document.getElementById('linesInput').value;

        let res = config.template;
        res = res.replace(/{artStyle}/g, selectedArtStyle || '未選擇');
        res = res.replace(/{subStyle}/g, selectedSubStyle || '未選擇');
        res = res.replace(/{bgColor}/g, bgColor);
        res = res.replace(/{textColor}/g, textColor);
        res = res.replace(/{linesText}/g, linesText);

        document.getElementById('resultOutput').innerText = res;
        document.getElementById('resultCard').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function copyResult() {
        const text = document.getElementById('resultOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Prompt 已成功複製到剪貼簿！');
        });
    }

    init();
</script>
</body>
</html>
