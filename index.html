<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 貼圖 Prompt 生成器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css"/>

    <style>
        :root {
            --primary-green: #388e3c;
            --primary-green-hover: #2e7d32;
            --bg-gray: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1a202c;
            --text-sub: #718096;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; color: #111827; }
        .header p { color: var(--text-sub); font-size: 0.95rem; }

        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
        .color-input-wrapper { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; padding: 6px 10px; }
        
        .pickr { margin-right: 10px; }
        .pickr .pcr-button { width: 32px !important; height: 32px !important; border-radius: 6px !important; }
        
        .color-code-input { border: none; outline: none; width: 100%; font-size: 0.95rem; text-transform: uppercase; font-family: monospace; }

        .selection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; font-size: 0.95rem; outline: none; cursor: pointer; }
        
        .cat-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 6px 0; border: none; background: #edf2f7; border-radius: 6px; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary-green); color: white; }

        .preview-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; background: #fff; text-align: center; margin-top: 10px; }
        .preview-card img { width: 100%; height: 260px; object-fit: contain; border-radius: 8px; margin-bottom: 8px; }
        .preview-card p { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }

        .lines-section { margin-bottom: 30px; }
        .lines-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
        .preset-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .preset-btn { background: #fef08a; color: #854d0e; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .preset-btn:hover { background: #fde047; }

        .inputs-16-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
        .line-item label { display: block; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .line-item input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; font-size: 0.9rem; outline: none; }

        .action-btn-wrapper { text-align: center; margin: 30px 0; }
        .btn-copy { background: var(--primary-green); color: white; border: none; padding: 12px 32px; font-size: 1.05rem; font-weight: 700; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: background 0.2s; }
        .btn-copy:hover { background: var(--primary-green-hover); }

        .output-card { background: #f1f5f9; border-radius: 12px; padding: 20px; margin-top: 20px; border: 1px solid var(--border-color); }
        .output-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
        textarea { width: 100%; height: 260px; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 0.85rem; font-family: monospace; background: #fff; resize: vertical; line-height: 1.5; outline: none; }

        .footer { text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AI 貼圖 Prompt 生成器</h1>
        <p>自訂背景色、文字顏色、畫風、風格和 16 句台詞，一鍵生成完整的 AI 貼圖製作提示詞</p>
    </div>

    <div class="color-grid">
        <div class="form-group">
            <label>背景色碼</label>
            <div class="color-input-wrapper">
                <div id="bgColorPicker"></div>
                <input type="text" id="bgColorCode" class="color-code-input" value="#E800E8" oninput="updatePickrFromInput('bg', this.value)">
            </div>
        </div>
        <div class="form-group">
            <label>文字色碼</label>
            <div class="color-input-wrapper">
                <div id="textColorPicker"></div>
                <input type="text" id="textColorCode" class="color-code-input" value="#424200" oninput="updatePickrFromInput('text', this.value)">
            </div>
        </div>
    </div>

    <div class="selection-grid">
        <div>
            <div class="form-group">
                <label>畫風</label>
                <select id="artStyleSelect" onchange="updateArtPreview()"></select>
            </div>
            <div class="preview-card">
                <img id="artPreviewImg" src="" alt="畫風預覽">
                <p id="artPreviewName"></p>
            </div>
        </div>

        <div>
            <div class="form-group">
                <label>風格</label>
                <div class="cat-tabs">
                    <button class="tab-btn active" onclick="switchCategory('可愛療癒系', this)">可愛療癒系</button>
                    <button class="tab-btn" onclick="switchCategory('女生類別', this)">女生類別</button>
                    <button class="tab-btn" onclick="switchCategory('男生類別', this)">男生類別</button>
                </div>
                <select id="subStyleSelect" onchange="updateSubPreview()"></select>
            </div>
            <div class="preview-card">
                <img id="subPreviewImg" src="" alt="風格預覽">
                <p id="subPreviewName"></p>
            </div>
        </div>
    </div>

    <div class="lines-section">
        <div class="lines-header">16 句日常台詞</div>
        <div class="preset-buttons">
            <button class="preset-btn" onclick="applyPreset('sweet')">甜蜜情侶</button>
            <button class="preset-btn" onclick="applyPreset('daily')">日常碎碎唸</button>
            <button class="preset-btn" onclick="applyPreset('work')">職場小姐</button>
            <button class="preset-btn" onclick="applyPreset('heal')">療癒系</button>
            <button class="preset-btn" onclick="applyPreset('funny')">搞笑逗趣</button>
        </div>

        <div class="inputs-16-grid" id="inputs16Container"></div>
    </div>

    <div class="action-btn-wrapper">
        <button class="btn-copy" onclick="copyAndGenerate()">📋 複製 Prompt</button>
    </div>

    <div class="output-card">
        <h3>預覽 Prompt</h3>
        <textarea id="promptOutput" readonly></textarea>
    </div>

    <div class="footer">
        © 2026 StickerFaster. All rights reserved.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

<script>
    // 全域預設資料區塊（從後台複製出來的程式碼貼在這裡）
    const defaultData = {
        artStyles: [
            { name: "水墨風", img: "image-print01.jpg" },
            { name: "色鉛筆風", img: "image-print02.jpg" },
            { name: "油畫風", img: "image-print03.jpg" },
            { name: "剪紙風", img: "image-print04.jpg" },
            { name: "像素Pixel風", img: "image-print05.jpg" },
            { name: "黏土3D風", img: "image-print06.jpg" },
            { name: "羊毛氈風", img: "image-print07.jpg" },
            { name: "版畫風", img: "image-print08.jpg" },
            { name: "復古海報風", img: "image-print09.jpg" },
            { name: "玻璃彩繪風", img: "image-print10.jpg" },
            { name: "手繪速寫風", img: "image-print11.jpg" }
        ],
        subStyles: [
            { name: "可愛療癒 01", category: "可愛療癒系", img: "image-Q01.png" },
            { name: "可愛療癒 02", category: "可愛療癒系", img: "image-Q02.png" },
            { name: "女生風格 01", category: "女生類別", img: "image-girl01.jpg" },
            { name: "男生風格 01", category: "男生類別", img: "image-boy01.jpg" }
        ],
        template: `以這個角色為我的角色。請用 [我的角色] 生成一張適合製作貼圖的 4×4 貼圖畫板。

基本規格：
- 畫布尺寸：1480×1280 px。
- 排版方式：4×4，共 16 格。
- 每格尺寸固定為 370×320 px。
- 16 張貼圖需從左到右、從上到下排列。
- 每張貼圖都必須完整位於各自格子中，不可互相重疊，而且上下左右必須距離格子2px。

角色一致性：
- 每一格都是同一角色的不同表情、動作或日常情境。
- 角色必須保持同一造型、同一配色、同一畫風與同一線條風格。
- 不要讓角色在不同格子中變成不同角色。
- 角色畫風：{artStyle}
- 角色風格：{subStyle}

背景與畫面限制：
- 背景顏色使用色碼{bgColor}
- 文字顏色使用色碼{textColor}
- 不要發光效果。
- 不要陰影光暈。

16 句日常台詞內容：
{linesText}`
    };

    const presets = {
        sweet: ["早安呀", "想你了", "愛你喔", "辛苦啦", "抱抱", "想吃什麼", "等下見", "親一個", "好想你", "晚安夢到我", "寶貝加油", "最喜歡你了", "收到！", "開心", "對不起嘛", "永遠愛你"],
        daily: ["早安", "辛苦了", "謝謝你", "OK!", "+1", "收到", "哈哈", "拜託了", "晚安", "對不起", "愛你喔", "傻眼", "加油", "讚啦", "忙碌中", "OK啦"],
        work: ["收到", "辛苦了", "收到謝謝", "好的沒問題", "確認中", "開會中", "稍後回覆", "加油", "請問這個", "請查收", "沒問題", "感謝協助", "理解", "好的", "下班了！", "辛苦各位"],
        heal: ["加油喔", "隨時都在", "沒關係的", "放輕鬆", "今天也很棒", "休息一下吧", "辛苦你了", "拍拍", "慢慢來", "別擔心", "一切都會好", "擁抱你", "喝口水吧", "祝你有好夢", "真讚", "你最棒"],
        funny: ["要確定誒", "哭啊", "你厲害", "傻眼", "這是什麼鬼", "我看是你", "我阿嬤都比你強", "請停止你的表演", "登愣", "阿不就好棒棒", "差點吐血", "我就爛", "算你狠", "廢到笑", "驚不驚喜", "下去吧"]
    };

    function getConfig() {
        const stored = localStorage.getItem('sticker_generator_config');
        if (stored) {
            try { return JSON.parse(stored); } catch(e) { return defaultData; }
        }
        return defaultData;
    }

    let config = getConfig();
    let currentCategory = '可愛療癒系';
    let bgPickr, textPickr;

    function checkAndOpenExternalBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isLine = ua.indexOf('Line') > -1 || ua.indexOf('LINE') > -1;

        if (isLine) {
            const currentUrl = window.location.href;
            if (/android/i.test(ua)) {
                const intentUrl = 'intent://' + currentUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
                window.location.href = intentUrl;
            } else if (/iPhone|iPad|iPod/i.test(ua)) {
                if (currentUrl.indexOf('openExternalBrowser=1') === -1) {
                    const delimiter = currentUrl.indexOf('?') > -1 ? '&' : '?';
                    window.location.href = currentUrl + delimiter + 'openExternalBrowser=1';
                }
            }
        }
    }

    function reloadConfigAndUI() {
        config = getConfig();
        loadArtStyles();
        loadSubStyles();
        buildPrompt();
    }

    window.addEventListener('storage', (event) => {
        if (event.key === 'sticker_generator_config') reloadConfigAndUI();
    });

    window.addEventListener('focus', () => reloadConfigAndUI());

    function init() {
        checkAndOpenExternalBrowser();
        initPickr();
        render16Inputs();
        loadArtStyles();
        loadSubStyles();
        applyPreset('daily');
    }

    function initPickr() {
        const pickrConfig = {
            theme: 'nano',
            components: {
                preview: true, opacity: false, hue: true,
                interaction: { hex: true, input: true, clear: false, save: true }
            }
        };

        bgPickr = Pickr.create({ el: '#bgColorPicker', default: '#E800E8', ...pickrConfig });
        textPickr = Pickr.create({ el: '#textColorPicker', default: '#424200', ...pickrConfig });

        bgPickr.on('change', (color) => {
            document.getElementById('bgColorCode').value = color.toHEXA().toString();
            buildPrompt();
        });

        textPickr.on('change', (color) => {
            document.getElementById('textColorCode').value = color.toHEXA().toString();
            buildPrompt();
        });
    }

    function updatePickrFromInput(type, val) {
        if (/^#[0-9A-F]{6}$/i.test(val)) {
            if (type === 'bg' && bgPickr) bgPickr.setColor(val);
            if (type === 'text' && textPickr) textPickr.setColor(val);
        }
        buildPrompt();
    }

    function render16Inputs() {
        const container = document.getElementById('inputs16Container');
        container.innerHTML = '';
        for (let i = 1; i <= 16; i++) {
            const div = document.createElement('div');
            div.className = 'line-item';
            div.innerHTML = `<label>台詞 ${i}</label><input type="text" id="line_${i}" oninput="buildPrompt()">`;
            container.appendChild(div);
        }
    }

    function loadArtStyles() {
        const select = document.getElementById('artStyleSelect');
        select.innerHTML = '';
        const styles = config.artStyles || defaultData.artStyles;
        styles.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.dataset.img = item.img;
            opt.textContent = item.name;
            select.appendChild(opt);
        });
        updateArtPreview();
    }

    function updateArtPreview() {
        const select = document.getElementById('artStyleSelect');
        const selectedOpt = select.options[select.selectedIndex];
        if (selectedOpt) {
            document.getElementById('artPreviewImg').src = selectedOpt.dataset.img || '';
            document.getElementById('artPreviewName').textContent = selectedOpt.value;
        }
        buildPrompt();
    }

    function switchCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadSubStyles();
    }

    function loadSubStyles() {
        const select = document.getElementById('subStyleSelect');
        select.innerHTML = '';
        const allSubStyles = config.subStyles || defaultData.subStyles;
        const filtered = allSubStyles.filter(s => s.category === currentCategory || !s.category);
        
        filtered.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.dataset.img = item.img;
            opt.textContent = item.name;
            select.appendChild(opt);
        });

        if (filtered.length === 0) {
            const opt = document.createElement('option');
            opt.value = "無風格選項";
            select.appendChild(opt);
        }
        updateSubPreview();
    }

    function updateSubPreview() {
        const select = document.getElementById('subStyleSelect');
        const selectedOpt = select.options[select.selectedIndex];
        if (selectedOpt && selectedOpt.dataset.img) {
            document.getElementById('subPreviewImg').src = selectedOpt.dataset.img;
            document.getElementById('subPreviewName').textContent = selectedOpt.value;
        } else {
            document.getElementById('subPreviewImg').src = '';
            document.getElementById('subPreviewName').textContent = select.value;
        }
        buildPrompt();
    }

    function applyPreset(key) {
        const list = presets[key];
        if (list) {
            for (let i = 1; i <= 16; i++) {
                document.getElementById(`line_${i}`).value = list[i - 1] || '';
            }
            buildPrompt();
        }
    }

    function buildPrompt() {
        const bg = document.getElementById('bgColorCode').value;
        const textClr = document.getElementById('textColorCode').value;
        const art = document.getElementById('artStyleSelect').value || '未選擇';
        const sub = document.getElementById('subStyleSelect').value || '未選擇';

        let linesList = [];
        for (let i = 1; i <= 16; i++) {
            const val = document.getElementById(`line_${i}`).value || '';
            linesList.push(`${i}. ${val}`);
        }

        let res = config.template || defaultData.template;
        res = res.replace(/{artStyle}/g, art);
        res = res.replace(/{subStyle}/g, sub);
        res = res.replace(/{bgColor}/g, bg);
        res = res.replace(/{textColor}/g, textClr);
        res = res.replace(/{linesText}/g, linesList.join('\n'));

        document.getElementById('promptOutput').value = res;
    }

    function copyAndGenerate() {
        const textarea = document.getElementById('promptOutput');
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(() => {
            alert('📋 已成功複製 Prompt 提示詞！');
        });
    }

    init();
</script>
</body>
</html>
